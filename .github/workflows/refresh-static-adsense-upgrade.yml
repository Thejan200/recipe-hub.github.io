name: Regenerate static pages for content upgrade
on:
  push:
    branches:
      - codex/adsense-readiness-sitewide-upgrade
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/build-static-seo-pages.js
      - run: |
          rm .github/workflows/refresh-static-adsense-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes categories sitemap.xml .github/workflows/refresh-static-adsense-upgrade.yml
          git diff --cached --quiet || git commit -m "Regenerate static pages for content upgrade"
          git push
