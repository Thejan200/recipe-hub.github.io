name: Regenerate static SEO output

on:
  push:
    branches: [fix/recipe-pdf-downloads]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: node tools/build-static-seo-pages.js
      - run: python .github/validate.py
      - run: python .github/validate_extended.py
      - run: python .github/validate_static_seo.py
      - run: python .github/validate_brand.py
      - run: python .github/validate_favicons.py
      - run: node --check assets/js/pdf-export.js
      - run: node --check assets/js/static-pages.js
      - run: git diff --check
      - name: Commit generated static output
        run: |
          git rm .github/workflows/regenerate-static-seo.yml
          git add recipes categories
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate static pages for PDF export"
          git push
