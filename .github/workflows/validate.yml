name: Validate BiteSparks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate site structure and recipe data
        run: python .github/validate.py
      - name: Run extended runtime and inline audit
        run: python .github/validate_extended.py
      - name: Validate BiteSparks internal naming
        run: python .github/validate_brand.py
      - name: Validate favicon and app icons
        run: python .github/validate_favicons.py
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -e
          find assets/js admin -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Check for obvious secrets
        shell: bash
        run: |
          if grep -RniE '(ghp_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY)' --exclude-dir=.git .; then exit 1; fi
