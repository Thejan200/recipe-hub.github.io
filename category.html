<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://bitesparks.com/categories.html">
  <meta http-equiv="refresh" content="0;url=categories.html">
  <title>Category moved | BiteSparks</title>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const category = params.get('category');
      const slugs = {'Breakfast':'breakfast','Dinner':'dinner','Chicken':'chicken','Beef':'beef','Pork':'pork','Seafood':'seafood','Soup':'soup','Dessert':'dessert','Pasta':'pasta','Salad':'salad','Appetizer':'appetizer','USA':'usa','Canada':'canada','UK':'uk','Healthy':'healthy','Vegetarian':'vegetarian','Quick & Easy':'quick-and-easy','Christmas':'christmas','New Year':'new-year'};
      if (category && !params.get('q') && slugs[category]) location.replace(`categories/${slugs[category]}/`);
    })();
  </script>
</head>
<body>
  <p>This category has moved. <a href="categories.html">Browse BiteSparks categories</a>.</p>
</body>
</html>
