<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Recipe Hub Content Manager</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="../index.html"><span class="brand-mark">RH</span><span>Recipe<span>Hub</span></span></a><a class="saved-link" href="../recipes.html">View site →</a></div></header><main><section class="page-head"><div class="container"><p class="eyebrow">CONTENT WORKSPACE</p><h1>Recipe Manager</h1><p>Create recipe content locally before publishing it to <code>data/recipes.json</code>.</p></div></section><section class="section"><div class="container admin-grid"><form id="recipe-form" class="admin-form"><h2>New recipe</h2><label>Title<input required name="title"></label><label>Slug<input required name="slug" placeholder="my-new-recipe"></label><label>Category<input required name="category" placeholder="Dinner"></label><label>Tags<input name="tags" placeholder="Chicken, Quick & Easy"></label><label>Description<textarea required name="description" rows="4"></textarea></label><label>Image URL<input name="image" type="url"></label><div class="two"><label>Prep time (minutes)<input name="prep" type="number" min="0" value="10"></label><label>Cook time (minutes)<input name="cook" type="number" min="0" value="20"></label></div><label>Servings<input name="servings" type="number" min="1" value="4"></label><label>Ingredients <small>One ingredient per line</small><textarea required name="ingredients" rows="8"></textarea></label><label>Detailed instructions <small>Required: at least 8 substantial steps, with an average of 100+ characters per step. Every step should guide a beginner through one clear action and explain useful details such as preparation, heat level, timing, visual or texture cues, safety notes, and exactly when to move on.</small><textarea required name="instructions" rows="18" placeholder="Step 1: Explain the first preparation clearly...&#10;Step 2: Explain the next action, timing, and what to look for...&#10;Step 3: Continue with beginner-friendly detail...&#10;Step 4: ...&#10;Step 5: ...&#10;Step 6: ...&#10;Step 7: ...&#10;Step 8: ..."></textarea><div class="editorial-fields"><h3>Reader-help sections</h3><p class="muted">These appear below the main recipe instructions and give beginners extra practical help. Use one useful point per line.</p><label>Recipe Tips <textarea required name="tips" rows="5" placeholder="Prepare ingredients before starting...&#10;Check doneness by...&#10;Taste and adjust...&#10;..." ></textarea></label><label>Common Mistakes <textarea required name="mistakes" rows="5" placeholder="Do not overcrowd the pan...&#10;Do not overcook...&#10;Avoid adding too much...&#10;..." ></textarea></label><label>Substitutions <textarea required name="substitutions" rows="5" placeholder="Use X instead of Y...&#10;Swap X for Y...&#10;For a dairy-free option...&#10;..." ></textarea></label><label>Storage & Reheating <textarea required name="storage" rows="5" placeholder="Refrigerate leftovers...&#10;Reheat gently...&#10;Freeze portions if suitable...&#10;..." ></textarea></label></div><div class="video-fields"><h3>YouTube video — optional</h3><p class="muted">Only embed a public YouTube video when you have a legitimate right to use the embed. Keep the original channel credited and link back to the YouTube video.</p><label>YouTube video ID<input name="youtubeId" placeholder="e.g. ZqMqTB7RSjo"></label><label>Video title<input name="videoTitle" placeholder="Original YouTube video title"></label><label>Channel name<input name="videoChannel" placeholder="Original channel name"></label><label>Channel URL<input name="videoChannelUrl" type="url" placeholder="https://www.youtube.com/@channel"></label><label>Video URL<input name="videoUrl" type="url" placeholder="https://www.youtube.com/watch?v=..."></label></div><button class="btn btn-primary">Generate JSON</button><p id="msg" class="muted"></p></form><aside class="admin-help"><h2>Publishing workflow</h2><ol><li>Fill in all recipe details.</li><li>Write <b>at least 8 substantial steps</b>; each should tell a beginner exactly what to do, how to do it, what result to look for, and when to continue.</li><li>Add at least 3 useful points each for tips, common mistakes, substitutions, and storage/reheating.</li><li>If adding a YouTube video, enter the original video's ID, title, channel, channel URL, and watch URL.</li><li>Click <b>Generate JSON</b>.</li><li>Copy the generated object into <code>data/recipes.json</code>.</li><li>Commit the file to GitHub.</li></ol><p><b>Quality gate:</b> the site validator requires at least 8 instruction steps, no step shorter than 80 characters, and an average step length of at least 100 characters. This prevents future recipes from reverting to overly brief instructions.</p><p><b>Video rule:</b> Recipe Hub embeds YouTube videos; it does not download, re-upload, crop, or claim ownership of third-party videos. The original YouTube channel is displayed as the video source and linked.</p><p><b>Security:</b> this page has no GitHub write token or admin credential. Never embed GitHub credentials in a static GitHub Pages site.</p><pre id="output" class="json-output"></pre></aside></div></section></main><script>const f=document.getElementById('recipe-form');f.onsubmit=e=>{e.preventDefault();const x=new FormData(f),steps=x.get('instructions').split(/\n+/).map(s=>s.trim()).filter(Boolean),avg=steps.length?steps.reduce((sum,s)=>sum+s.length,0)/steps.length:0,lines=n=>x.get(n).split(/\n+/).map(s=>s.trim()).filter(Boolean);if(steps.length<8){document.getElementById('msg').textContent='Please provide at least 8 substantial instruction steps.';return}if(steps.some(s=>s.length<80)){document.getElementById('msg').textContent='Every instruction step must be at least 80 characters and explain the action clearly.';return}if(avg<100){document.getElementById('msg').textContent='The instructions are still too terse. The average step length must be at least 100 characters.';return}for(const g of ['tips','mistakes','substitutions','storage']){if(lines(g).length<3){document.getElementById('msg').textContent=`Please provide at least 3 useful points for ${g}.`;return}}const yt=x.get('youtubeId').trim(),title=x.get('videoTitle').trim(),channel=x.get('videoChannel').trim(),channelUrl=x.get('videoChannelUrl').trim(),videoUrl=x.get('videoUrl').trim();if(yt&&(!title||!channel||!channelUrl||!videoUrl)){document.getElementById('msg').textContent='For a YouTube video, title, channel name, channel URL, and video URL are all required for proper attribution.';return}const prep=+x.get('prep')||0,cook=+x.get('cook')||0;const obj={id:x.get('slug'),slug:x.get('slug'),title:x.get('title'),status:'draft',category:x.get('category'),tags:x.get('tags').split(',').map(s=>s.trim()).filter(Boolean),image:x.get('image'),description:x.get('description'),prepTime:`PT${prep}M`,cookTime:`PT${cook}M`,totalTime:`PT${prep+cook}M`,servings:+x.get('servings'),ingredients:lines('ingredients'),instructions:steps,tips:lines('tips'),commonMistakes:lines('mistakes'),substitutions:lines('substitutions'),storage:lines('storage')};if(yt)obj.video={youtubeId:yt,title,channel,channelUrl,url:videoUrl,description:`A related YouTube video published by ${channel}.`};document.getElementById('output').textContent=JSON.stringify(obj,null,2);document.getElementById('msg').textContent='Detailed recipe JSON generated. Review all guidance and attribution before publishing.'}</script><style>.page-head{background:var(--cream);padding:55px 0}.page-head h1{font:700 52px 'Playfair Display';margin:0 0 10px}.page-head p:not(.eyebrow){color:var(--muted)}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:55px}.admin-form{display:grid;gap:15px}.admin-form h2,.admin-help h2{font:700 30px 'Playfair Display';margin:0 0 5px}.admin-form h3{margin:8px 0 0}.admin-form label{font-size:13px;font-weight:600}.admin-form input,.admin-form textarea{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit}.admin-form small{display:block;color:var(--muted);font-weight:400;line-height:1.5}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.video-fields,.editorial-fields{border-top:1px solid var(--line);padding-top:20px;display:grid;gap:15px}.admin-help{background:var(--cream);padding:28px;border-radius:16px;height:max-content}.admin-help li{margin:12px 0}.json-output{white-space:pre-wrap;max-height:500px;overflow:auto;background:#181c1a;color:#eee;padding:18px;border-radius:10px;font-size:11px}@media(max-width:800px){.admin-grid{grid-template-columns:1fr}}</style></body></html>
