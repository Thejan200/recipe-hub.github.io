<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#17120f">
<link rel="icon" href="../../favicon.svg?v=2" type="image/svg+xml">
<link rel="stylesheet" href="../../assets/css/story-viewer.css?v=2">
<title>Recipe Stories Viewer | BiteSparks</title>
</head>
<body class="story-viewer-page">
<a class="story-viewer-close" href="../" aria-label="Close Story viewer and return to Stories" title="Close Stories">×</a>
<main class="story-viewer" aria-label="Recipe Stories viewer">
  <div class="story-viewer__stage" id="story-viewer-stage" aria-live="polite">
    <p class="story-viewer__loading">Loading story…</p>
  </div>
  <p class="story-viewer__hint">Swipe up or down to switch Stories. Tap left or right to change slides.</p>
</main>
<script src="../../assets/js/story-viewer.js?v=2"></script>
</body>
</html>
