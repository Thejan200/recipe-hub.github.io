<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#17120f">
<link rel="icon" href="../../favicon.svg?v=2" type="image/svg+xml">
<link rel="stylesheet" href="../../assets/css/story-viewer.css?v=4">
<title>Recipe Stories Viewer | BiteSparks</title>
</head>
<body class="story-viewer-page">
<a class="story-viewer-close" href="../" aria-label="Close Story viewer and return to Stories" title="Close Stories">×</a>
<main class="story-viewer" aria-label="Recipe Stories viewer">
  <div class="story-viewer__stage" id="story-viewer-stage" aria-live="polite">
    <p class="story-viewer__loading">Loading story…</p>
  </div>
  <aside class="story-viewer__hint-dialog" id="story-viewer-hint" role="dialog" aria-label="Story navigation help"><button class="story-viewer__hint-close" type="button" aria-label="Close navigation help">×</button><p class="story-viewer__hint-title">How to navigate</p><div class="story-viewer__hint-cue"><span aria-hidden="true">↕</span><p><strong>Swipe up or down</strong><small>Switch Stories</small></p></div><div class="story-viewer__hint-cue"><span aria-hidden="true">← →</span><p><strong>Tap left or right</strong><small>Change slides</small></p></div></aside>
</main>
<script src="../../assets/js/story-viewer.js?v=6"></script>
</body>
</html>
