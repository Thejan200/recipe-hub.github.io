ckground:var(--soft);border-radius:22px}.recipe-video .section-head{margin-bottom:20px}.recipe-video h2{font:700 34px 'Playfair Display';margin:0}.video-frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:14px;background:#111}.video-frame iframe{width:100%;height:100%;border:0}.video-credit{margin:12px 0 0;font-size:12px;color:var(--muted)}.video-credit a{text-decoration:underline;font-weight:600}.recipe-layout{width:min(1000px,calc(100% - 40px));margin:0 auto;display:grid;grid-template-columns:1.5fr .8fr;gap:70px}.recipe-layout h2{font:700 34px 'Playfair Display';margin:0 0 20px}.ingredients{padding:0;list-style:none;border-top:1px solid var(--line);margin-bottom:55px}.ingredients li{padding:12px 0;border-bottom:1px solid var(--line)}.ingredients li:before{content:'✓';color:var(--accent);margin-right:10px;font-weight:700}.instructions{padding-left:35px}.instructions li{padding:0 0 25px 10px}.instructions li::marker{font-weight:700;color:var(--accent)}.recipe-box{background:var(--cream);padding:28px;border-radius:18px;height:max-content;position:sticky;top:100px}.recipe-box h2{font-size:27px}.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #eadfd3;border-bottom:1px solid #eadfd3;margin:20px 0}.stats span{padding:12px 0;display:flex;flex-direction:column;font-size:12px}.stats b{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:1px}.related{width:min(1000px,calc(100% - 40px));margin:40px auto 80px;padding-bottom:0}@media(max-width:800px){.recipe-hero{grid-template-columns:1fr;gap:30px;margin:45px auto}.recipe-layout{grid-template-columns:1fr;gap:35px}.recipe-box{position:static}.detail-image{order:-1}.recipe-video{margin-bottom:45px;padding:20px;border-radius:16px}.recipe-video h2{font-size:30px}}@media(max-width:520px){.recipe-hero,.recipe-layout,.recipe-video{width:min(100% - 28px,1000px)}} </style></body></html>
